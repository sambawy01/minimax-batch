[project]
name = "minimax-batch"
version = "0.1.0"
description = "Batch-generate MiniMax Hailuo H3 video clips from a YAML/CSV file via the official MiniMax API: resumable, and never bills a clip twice."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "minimax-batch contributors" }]
keywords = ["minimax", "hailuo", "video-generation", "text-to-video", "image-to-video", "batch", "cli", "ai-video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/sambawy01/minimax-batch"
Repository = "https://github.com/sambawy01/minimax-batch"
Issues = "https://github.com/sambawy01/minimax-batch/issues"
Changelog = "https://github.com/sambawy01/minimax-batch/releases"

[project.scripts]
minimax-batch = "minimax_batch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
